<!DOCTYPE html><html lang="ko"><head>
<style id="mp-gate-css">html.mp-locked body>*:not(#mp-gate-ui){display:none!important}</style><script>(function(){var K='mp-gate',P='pundit2026',ok=false;try{ok=localStorage.getItem(K)===P;}catch(e){}if(ok)return;document.documentElement.classList.add('mp-locked');document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.id='mp-gate-ui';d.innerHTML='<div style="max-width:380px;margin:120px auto;background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:32px;font:15px/1.6 Pretendard,sans-serif;color:#222;text-align:center"><b style="font-size:20px;display:block;margin-bottom:6px">Mypundit 검토 페이지</b><p style="color:#666;margin:0 0 18px">접속 비밀번호를 입력해 주세요.</p><input id="mp-gate-in" type="password" autocomplete="off" style="width:100%;height:46px;border:1px solid #ccc;border-radius:8px;padding:0 14px;font-size:16px;box-sizing:border-box"><button id="mp-gate-btn" type="button" style="width:100%;height:46px;margin-top:10px;background:#00459b;color:#fff;border:0;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer">입장</button><p id="mp-gate-msg" style="color:#c8401a;font-size:13px;margin:10px 0 0;min-height:18px"></p></div>';document.body.appendChild(d);var i=document.getElementById('mp-gate-in');function go(){if(i.value===P){try{localStorage.setItem(K,P);}catch(e){}d.remove();document.documentElement.classList.remove('mp-locked');}else{document.getElementById('mp-gate-msg').textContent='비밀번호가 맞지 않습니다.';i.select();}}document.getElementById('mp-gate-btn').onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go();};i.focus();});})();</script><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=m_002.html"><title>PUNDIT</title></head><body><a href="m_002.html">대시보드로 이동</a></body></html>
